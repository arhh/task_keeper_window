name: Build App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: "ubuntu-24.04"
  
    steps:
    - name: Check out repo
      uses: actions/checkout@v4
      
    - name: Build
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: npm ci
    - run: npm run package

    - name: Upload artefact
      uses: actions/upload-artifact@v4
      with:
        name: appimage-ubuntu
        path: dist/g-apps-navigator.AppImage
        retention-days: 1
