name: Build App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: ["ubuntu-slim", "windows-latest"]
    runs-on: ${{ matrix.os }}
  
    steps:
    - name: Check out repo
      uses: actions/checkout@v7.0.1
      
    - name: Build
      uses: actions/setup-node@v7.1.0
      with:
        node-version: 24
    - run: npm ci
    - run: npm run package

    - name: Upload artefact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: distributable
        path: dist
        retention-days: 1

