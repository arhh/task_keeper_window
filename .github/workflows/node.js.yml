name: Default Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    strategy:
      matrix:
        os: ["ubuntu-slim", "windows-latest"]
    runs-on: ${{ matrix.os }}
  
    steps:
    - name: Check out repo
      uses: actions/checkout@v7.0.1
      
    - name: Setup Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version: 24
      
    - name: Install project
      run: npm ci

    - name: Pack and publish
      run: npm run package
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload distributable artefacts
      uses: actions/upload-artifact@v7.0.2
      with:
        name: appimage
        path: "dist/g-apps-navigator.AppImage"
        retention-days: 1
