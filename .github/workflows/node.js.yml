name: Default Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: ["ubuntu-slim"]
    runs-on: ${{ matrix.os }}
  
    steps:
    - name: Check out repo
      uses: actions/checkout@v7.0.1
      
    - name: Build
      uses: actions/setup-node@v7.1.0
      with:
        node-version: 24
    - run: npm ci
    - run: npm run package

    - name: Upload distributable
      uses: actions/upload-artifact@v7.0.2
      with:
        name: appimage
        path: "dist/g-apps-navigator.AppImage"
        retention-days: 1
